<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fire on Candles | Ignite Your Senses</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2 { font-family: 'Playfair Display', serif; }
        .amber-glow { color: #FFBF00; }
        .bg-charcoal { background-color: #1A1A1A; }
    </style>
</head>
<body class="bg-stone-50">

    <!-- Navigation -->
    <nav class="flex justify-between items-center p-6 bg-white border-b border-stone-200">
        <div class="text-2xl font-bold tracking-tighter">FIRE ON <span class="amber-glow">CANDLES</span></div>
        <div class="space-x-8 text-sm uppercase tracking-widest font-medium">
            <a href="#" class="hover:text-amber-600">Shop</a>
            <a href="#" class="hover:text-amber-600">Collections</a>
            <a href="#" class="hover:text-amber-600">About</a>
        </div>
        <div class="flex items-center space-x-4">
            <button onclick="toggleModal('auth-modal')" class="border border-charcoal px-4 py-2 text-xs font-semibold hover:bg-charcoal hover:text-white transition">SIGN IN</button>
            <div class="relative">🛒 <span class="absolute -top-2 -right-2 bg-amber-500 text-white text-[10px] rounded-full px-1">0</span></div>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="relative h-[80vh] flex items-center justify-center text-center bg-stone-200">
        <div class="z-10 px-4">
            <h1 class="text-5xl md:text-7xl mb-4">Crafted for the Moments <br> that Matter.</h1>
            <p class="text-lg text-stone-600 mb-8 max-w-lg mx-auto">Luxury hand-poured candles with sustainable wax and intoxicating scents.</p>
            <button class="bg-charcoal text-white px-10 py-4 text-sm font-bold tracking-widest hover:bg-amber-600 transition">EXPLORE THE COLLECTION</button>
        </div>
    </header>

    <!-- Authentication Modal (Hidden by default) -->
    <div id="auth-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-lg w-full max-w-md relative shadow-2xl">
            <button onclick="toggleModal('auth-modal')" class="absolute top-4 right-4 text-stone-400 hover:text-black">✕</button>
            
            <h2 class="text-3xl text-center mb-2">Welcome Back</h2>
            <p class="text-stone-500 text-center text-sm mb-8">Choose your preferred sign-in method</p>

            <!-- Fast Auth Methods -->
            <div class="space-y-3">
                <button class="w-full border flex items-center justify-center py-3 rounded hover:bg-stone-50 transition">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" class="w-5 h-5 mr-3"> Continue with Google
                </button>
                <button class="w-full bg-black text-white flex items-center justify-center py-3 rounded hover:bg-zinc-800 transition">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg" class="w-5 h-5 mr-3 invert"> Continue with Apple
                </button>
                <button class="w-full bg-[#1877F2] text-white flex items-center justify-center py-3 rounded hover:bg-blue-700 transition">
                     Continue with Facebook
                </button>
            </div>

            <div class="flex items-center my-6">
                <div class="flex-grow border-t border-stone-200"></div>
                <span class="px-3 text-xs text-stone-400">OR EMAIL</span>
                <div class="flex-grow border-t border-stone-200"></div>
            </div>

            <!-- Email Login -->
            <form class="space-y-4">
                <input type="email" placeholder="Email Address" class="w-full border p-3 rounded text-sm outline-amber-500">
                <input type="password" placeholder="Password" class="w-full border p-3 rounded text-sm outline-amber-500">
                <button class="w-full bg-charcoal text-white py-3 font-bold hover:bg-amber-600 transition">SIGN IN</button>
            </form>
            
            <p class="mt-6 text-center text-sm text-stone-500">
                New to Fire on Candles? <a href="#" class="text-amber-600 font-semibold underline">Create Account</a>
            </p>
        </div>
    </div>

    <script>
        function toggleModal(id) {
            const modal = document.getElementById(id);
            modal.classList.toggle('hidden');
        }
    </script>
</body>
</html>
